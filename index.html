<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dalat Hasfarm – Nhắc việc</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f1f6ef;--card:#fff;--ink:#16301f;--mute:#5d7565;--line:#d5e2d6;--acc:#1f7a4d;--onacc:#fff;--orange:#f28c1a;--late:#e5383b;--soon:#e59a00;--ok:#2e9e5b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1a11;--card:#152a1d;--ink:#e6f2e8;--mute:#93ad9a;--line:#26412f;--acc:#4ed08a;--onacc:#07220f;--orange:#ffa53d;--late:#ff6b6e;--soon:#fbbf24;--ok:#4ed08a}}
:root[data-theme="dark"]{--bg:#0c1a11;--card:#152a1d;--ink:#e6f2e8;--mute:#93ad9a;--line:#26412f;--acc:#4ed08a;--onacc:#07220f;--orange:#ffa53d;--late:#ff6b6e;--soon:#fbbf24;--ok:#4ed08a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Be Vietnam Pro',system-ui,sans-serif;line-height:1.5}
main{max-width:680px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
h1{margin:0;font-size:1.9rem;font-weight:800;letter-spacing:-.02em}
.date{color:var(--mute);font-size:.95rem}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;color:var(--mute);font-size:.85rem}
#alert{display:none;background:var(--late);color:#fff;border-radius:12px;padding:12px 16px;margin-bottom:14px;font-weight:700}
#alert.on{display:block}
#alert small{display:block;font-weight:400;opacity:.92}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:10px;margin-bottom:16px}
form input,form textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:10px 12px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:end}
label{font-size:.8rem;color:var(--mute);display:block;margin-bottom:2px}
.add{background:var(--orange);color:#2a1600;border:0;border-radius:8px;padding:11px 18px;font-weight:700}
.tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
.tab{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mute);white-space:nowrap}
.tab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
li{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start}
li.late{border-left-color:var(--late)}li.soon{border-left-color:var(--soon)}li.done{border-left-color:var(--ok);opacity:.6}
li.done .t{text-decoration:line-through}
li input[type=checkbox]{width:22px;height:22px;margin-top:3px;accent-color:var(--ok)}
.t{font-weight:700;word-break:break-word}
.n{color:var(--mute);font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.due{font-size:.82rem;color:var(--mute);margin-top:2px}
li.late .due{color:var(--late);font-weight:700}li.soon .due{color:var(--soon);font-weight:700}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{border:1px solid var(--line);background:none;border-radius:8px;padding:6px 12px;font-size:.85rem;font-weight:500}
.btn.ok{background:var(--ok);border-color:var(--ok);color:var(--onacc);font-weight:700}
.mvp{margin-top:10px;padding:10px;border:1px dashed var(--line);border-radius:10px;display:grid;gap:8px}
.mvp input{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:8px 10px}
.del{background:none;border:0;color:var(--mute);font-size:1.2rem;padding:0 4px}
.empty{text-align:center;color:var(--mute);padding:30px 10px;border:1px dashed var(--line);border-radius:12px}
[hidden]{display:none!important}
.nav{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
.seg{background:none;border:0;border-bottom:3px solid transparent;padding:8px 14px;font-weight:700;color:var(--mute)}
.seg[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--orange)}
.otab{background:none;border:1px solid var(--line);border-radius:99px;padding:6px 14px;color:var(--mute);white-space:nowrap}
.otab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.g2{grid-template-columns:1fr}}
.line{display:grid;grid-template-columns:1fr 76px 92px auto;gap:6px;align-items:center;margin-bottom:6px}
#osearch{width:100%;border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 12px;margin-bottom:12px}
.code{font-weight:500;color:var(--mute);font-size:.85rem;margin-left:6px}
.ol{margin-top:6px;display:grid;gap:2px}
select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 10px;font:inherit;color:inherit}
.orow{display:flex;gap:8px;margin-bottom:12px}
.orow #osearch{margin-bottom:0;flex:1;width:auto;min-width:0}
.orow .btn{white-space:nowrap;padding:8px 14px}
#csearch{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:9px 12px;flex:1;min-width:0}
#clist{display:grid;gap:6px}
.crow{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
#welcome{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));background:linear-gradient(160deg,#0b3b25,#1f7a4d);color:#fff;overflow:hidden;transition:opacity .4s,transform .4s}
#welcome.out{opacity:0;transform:scale(1.03);pointer-events:none}
#welcome>:not(.deco){position:relative}
#welcome :focus-visible{outline-color:#fff}
.wlogo{width:76px;height:76px;flex:none;background:#fff;border-radius:50%;padding:6px}
.wg{font-size:1rem;opacity:.9}
.wq{margin:0;max-width:640px;font-size:clamp(1.3rem,4.6vw,2rem);font-weight:700;line-height:1.4;letter-spacing:-.01em;padding:0 8px}
.wq::before{content:"\201C";display:block;font-size:3.4rem;line-height:.6;color:#f28c1a}
.wgo{background:#f28c1a;color:#2a1600;border:0;border-radius:99px;padding:15px 34px;font-size:1.1rem;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.wgo:hover{background:#ffa53d}
.wmore{background:none;border:0;color:#fff;opacity:.8;text-decoration:underline;font-size:.9rem}
li.odone{border-left-color:var(--ok);opacity:.7}li.ocancel{border-left-color:var(--mute);opacity:.5}
.brand{position:relative;overflow:hidden;display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#0f4a2f,#1f7a4d);color:#fff;border-radius:16px;padding:16px 18px 13px;border-bottom:5px solid #f28c1a;margin-bottom:18px}
.brand>div{position:relative}
.logo{width:52px;height:52px;flex:none;background:#fff;border-radius:50%;padding:4px}
.bn{font-weight:800;font-size:1.25rem;letter-spacing:-.01em;line-height:1.2}
.bs{font-size:.8rem;opacity:.85}
.deco{position:absolute;pointer-events:none;--p:#fff;opacity:.13}
.d1{right:-24px;top:-34px;width:140px;height:140px}
.d2{right:96px;bottom:-22px;width:64px;height:64px;opacity:.09}
footer{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--mute);font-size:.8rem;margin-top:28px}
footer svg{width:16px;height:16px}
#toasts{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));display:grid;gap:8px;max-width:calc(100% - 24px);z-index:9}
.toast{background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
</style>
</head>
<body>
<div id="welcome" role="dialog" aria-modal="true" aria-label="Lời động viên">
  <svg class="deco" style="right:-40px;top:-50px;width:220px;height:220px" aria-hidden="true"><use href="#fl"/></svg>
  <svg class="deco" style="left:-50px;bottom:-50px;width:240px;height:240px" aria-hidden="true"><use href="#fl"/></svg>
  <svg class="wlogo" role="img" aria-label="Logo Dalat Hasfarm"><use href="#fl"/></svg>
  <div class="wg" id="wg"></div>
  <p class="wq" id="wq"></p>
  <button class="wgo" id="wgo" type="button">Bắt đầu ngày mới</button>
  <button class="wmore" id="wmore" type="button">Xem câu khác</button>
</div>
<main>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="fl" viewBox="0 0 64 64"><g style="fill:var(--p,#f28c1a)"><ellipse cx="32" cy="16" rx="7" ry="11"/><ellipse cx="32" cy="16" rx="7" ry="11" transform="rotate(72 32 32)"/><ellipse cx="32" cy="16" rx="7" ry="11" transform="rotate(144 32 32)"/><ellipse cx="32" cy="16" rx="7" ry="11" transform="rotate(216 32 32)"/><ellipse cx="32" cy="16" rx="7" ry="11" transform="rotate(288 32 32)"/></g><circle cx="32" cy="32" r="6" fill="#f5b700"/></symbol></svg>
<div class="brand">
  <svg class="logo" role="img" aria-label="Logo Dalat Hasfarm"><use href="#fl"/></svg>
  <div><div class="bn">Dalat Hasfarm</div><div class="bs">Công ty TNHH Dalat Hasfarm</div></div>
  <svg class="deco d1" aria-hidden="true"><use href="#fl"/></svg><svg class="deco d2" aria-hidden="true"><use href="#fl"/></svg>
</div>
<header>
  <div><h1 id="h1">Việc hôm nay</h1><div class="date" id="date"></div></div>
  <button class="ghost" id="notif" type="button">Bật thông báo</button>
</header>

<nav class="nav"><button class="seg" data-v="task" aria-pressed="true">Công việc</button><button class="seg" data-v="order" aria-pressed="false">Đơn hàng</button><button class="seg" data-v="settings" aria-pressed="false">Cài đặt</button></nav>
<section id="v-task">
<div id="alert" role="alert"></div>

<form id="f">
  <input id="title" placeholder="Bạn cần làm gì?" required maxlength="120" aria-label="Tên công việc">
  <textarea id="note" rows="2" placeholder="Ghi chú (không bắt buộc)" aria-label="Ghi chú"></textarea>
  <div class="row">
    <div><label for="due">Hạn hoàn thành</label><input id="due" type="datetime-local" required></div>
    <button class="add" type="submit">Thêm việc</button>
  </div>
</form>

<div class="tabs" id="tabs">
  <button class="tab" data-f="today" aria-pressed="true">Hôm nay</button>
  <button class="tab" data-f="late" aria-pressed="false">Trễ hạn</button>
  <button class="tab" data-f="all" aria-pressed="false">Tất cả</button>
  <button class="tab" data-f="done" aria-pressed="false">Đã xong</button>
</div>
<ul id="list"></ul>
</section>

<section id="v-order" hidden>
<form id="of">
  <div class="g2">
    <div><label for="ocn">Tên khách hàng</label><input id="ocn" list="dl-name" required autocomplete="off"></div>
    <div><label for="occ">Mã khách hàng</label><input id="occ" list="dl-code" autocomplete="off"></div>
  </div>
  <div class="g2">
    <div><label for="od">Ngày giao hàng</label><input id="od" type="date" required></div>
    <div><label for="ot">Thời gian nhận hàng</label><input id="ot" type="time" required></div>
  </div>
  <div><label for="oaddr">Địa chỉ giao hàng</label><input id="oaddr" autocomplete="off" placeholder="Số nhà, đường, phường/xã, quận/huyện, tỉnh/thành"></div>
  <div><label>Sản phẩm (mã hoặc tên, số lượng, đơn vị)</label><div id="lines"></div>
  <button type="button" class="btn" id="addline">+ Thêm dòng sản phẩm</button></div>
  <div><label for="onote">Ghi chú</label><textarea id="onote" rows="2"></textarea></div>
  <button class="add" type="submit">Tạo đơn hàng</button>
</form>
<div class="orow"><input id="osearch" type="search" placeholder="Tìm theo khách, mã, sản phẩm…" aria-label="Tìm đơn hàng"><button class="btn ok" id="oxl" type="button">Xuất Excel</button></div>
<div class="tabs" id="otabs">
  <button class="otab" data-o="open" aria-pressed="true">Đang xử lý</button>
  <button class="otab" data-o="today" aria-pressed="false">Giao hôm nay</button>
  <button class="otab" data-o="done" aria-pressed="false">Đã xong</button>
  <button class="otab" data-o="all" aria-pressed="false">Tất cả</button>
</div>
<ul id="olist"></ul>
<datalist id="dl-name"></datalist><datalist id="dl-code"></datalist>
<datalist id="dl-unit"><option value="Cành"><option value="Bó"><option value="Cái"></datalist>
</section>
<section id="v-set" hidden>
<form id="cf">
  <div class="g2">
    <div><label for="cn">Tên khách hàng</label><input id="cn" required autocomplete="off"></div>
    <div><label for="cc">Mã khách hàng</label><input id="cc" required autocomplete="off"></div>
  </div>
  <button class="add" type="submit">Thêm khách hàng</button>
</form>
<form id="imp">
  <b>Nhập nhiều khách hàng cùng lúc</b>
  <div><label for="cfile">Chọn file Excel hoặc CSV (cột 1 là Tên KH, cột 2 là Mã KH)</label><input id="cfile" type="file" accept=".xlsx,.xls,.csv"></div>
  <div><label for="cpaste">Hoặc dán từ Excel (mỗi dòng một khách: Tên KH rồi Mã KH)</label><textarea id="cpaste" rows="4"></textarea></div>
  <button class="btn ok" type="submit">Nhập danh sách dán</button>
</form>
<div class="orow"><input id="csearch" type="search" placeholder="Tìm khách hàng đã lưu…" aria-label="Tìm khách hàng"><button class="btn" id="cclear" type="button">Xóa tất cả</button></div>
<div class="due" id="ccount" style="margin-bottom:8px"></div>
<div id="clist"></div>
</section>
<footer><svg aria-hidden="true"><use href="#fl"/></svg>Công ty TNHH Dalat Hasfarm</footer>
</main>
<div id="toasts" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* Danh sách khách hàng để import: {code:'KH001',name:'Tên khách'} */
var CUSTOMERS=[];
var KEY='nhacviec.tasks.v1',tasks=[],filter='today';
function load(){try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){tasks=[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(tasks))}catch(e){}}
var $=function(id){return document.getElementById(id)};
function pad(n){return String(n).padStart(2,'0')}
function fmt(ts){var d=new Date(ts);return pad(d.getHours())+':'+pad(d.getMinutes())+' ngày '+pad(d.getDate())+'/'+pad(d.getMonth()+1)}
function isToday(ts){return new Date(ts).toDateString()===new Date().toDateString()}
function esc(s){return s.replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function rel(ms){var m=Math.round(Math.abs(ms)/60000);if(m<60)return m+' phút';var h=Math.floor(m/60);if(h<24)return h+' giờ '+(m%60?m%60+' phút':'');return Math.floor(h/24)+' ngày'}
function status(t){if(t.done)return'done';var d=t.due-Date.now();return d<0?'late':d<3600000?'soon':'ok'}

function beep(){try{var c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.35)}catch(e){}}
function toast(msg){var d=document.createElement('div');d.className='toast';d.textContent=msg;$('toasts').appendChild(d);setTimeout(function(){d.remove()},7000)}
function notify(title,body){toast(title+': '+body);beep();
  try{if('Notification' in window&&Notification.permission==='granted')new Notification(title,{body:body})}catch(e){}}

var moving=null;
function toInput(ts){var d=new Date(ts);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes())}
function actions(t){
  if(t.done)return '<div class="acts"><button class="btn" data-done="'+t.id+'">Hoàn tác</button></div>';
  var h='<div class="acts"><button class="btn ok" data-done="'+t.id+'">Đã hoàn thành</button><button class="btn" data-move="'+t.id+'" aria-expanded="'+(moving===t.id)+'">Dời việc</button></div>';
  if(moving===t.id)h+='<div class="mvp"><div class="acts" style="margin:0"><button class="btn" data-shift="'+t.id+'" data-h="1">+1 giờ</button><button class="btn" data-shift="'+t.id+'" data-h="24">+1 ngày</button><button class="btn" data-shift="'+t.id+'" data-h="168">+1 tuần</button></div><label for="mv-'+t.id+'">Hoặc chọn hạn mới</label><input id="mv-'+t.id+'" type="datetime-local" value="'+toInput(Math.max(t.due,Date.now()))+'"><div class="acts" style="margin:0"><button class="btn ok" data-save="'+t.id+'">Lưu hạn mới</button><button class="btn" data-move="'+t.id+'">Hủy</button></div></div>';
  return h}
function reschedule(t,ts){t.due=ts;t.warned=0;t.lateNotified=0;moving=null;save();toast('Đã dời hạn sang '+fmt(ts));check()}
function render(){
  var late=tasks.filter(function(t){return status(t)==='late'});
  var a=$('alert');
  if(late.length){a.className='on';a.innerHTML='Bạn có '+late.length+' việc trễ hạn<small>'+esc(late.map(function(t){return t.title}).slice(0,3).join(', '))+(late.length>3?'…':'')+'</small>';document.title='('+late.length+') Trễ hạn – Nhắc việc'}
  else{a.className='';document.title='Dalat Hasfarm – Nhắc việc'}
  var list=tasks.filter(function(t){
    if(filter==='today')return !t.done&&(isToday(t.due)||status(t)==='late');
    if(filter==='late')return status(t)==='late';
    if(filter==='done')return t.done;
    return true}).sort(function(x,y){return x.due-y.due});
  var msgs={today:'Hôm nay chưa có việc nào. Thêm việc đầu tiên ở khung phía trên.',late:'Không có việc nào trễ hạn.',done:'Chưa có việc nào hoàn thành.',all:'Chưa có việc nào.'};
  $('list').innerHTML=list.length?list.map(function(t){
    var s=status(t),d=t.due-Date.now(),info=t.done?'Đã xong':s==='late'?'Trễ '+rel(d)+' · hạn '+fmt(t.due):(s==='soon'?'Còn '+rel(d)+' · ':'')+'Hạn '+fmt(t.due);
    return '<li class="'+s+(t.done?' done':'')+'"><div><div class="t">'+esc(t.title)+'</div>'+(t.note?'<div class="n">'+esc(t.note)+'</div>':'')+'<div class="due">'+info+'</div>'+actions(t)+'</div><button class="del" data-del="'+t.id+'" aria-label="Xóa việc">×</button></li>'}).join('')
    :'<li class="empty" style="display:block;border-left:1px dashed var(--line)">'+msgs[filter]+'</li>';
}

function check(){
  var now=Date.now(),changed=false;
  tasks.forEach(function(t){
    if(t.done)return;
    var left=t.due-now;
    if(left<=600000&&left>0&&!t.warned){t.warned=1;changed=true;notify('Sắp đến hạn','"'+t.title+'" còn '+rel(left))}
    if(left<=0&&!t.lateNotified){t.lateNotified=1;changed=true;notify('Trễ hạn','"'+t.title+'" đã quá hạn')}
  });
  if(changed)save();
  if(moving===null)render();else{var x=tasks.filter(function(t){return status(t)==='late'}).length;document.title=x?'('+x+') Trễ hạn – Nhắc việc':'Dalat Hasfarm – Nhắc việc'}
}

$('f').addEventListener('submit',function(e){
  e.preventDefault();
  var due=new Date($('due').value).getTime();
  if(isNaN(due))return;
  tasks.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5),title:$('title').value.trim(),note:$('note').value.trim(),due:due,done:false});
  save();$('title').value='';$('note').value='';setDefaultDue();
  if(filter==='done')setFilter('today');
  toast('Đã thêm việc');check();
});
$('list').addEventListener('click',function(e){
  var b=e.target.closest('button');if(!b)return;var d=b.dataset;
  var t=tasks.find(function(x){return x.id===(d.done||d.move||d.shift||d.save)});
